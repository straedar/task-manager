<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TaskMaster">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="35%" stop-color="#ff9a3c"/>
      <stop offset="70%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#c43a10"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="55%" stop-color="#1a100c"/>
      <stop offset="100%" stop-color="#0c0806"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded plate -->
  <rect width="64" height="64" rx="14" fill="#141210"/>

  <!-- eyelid outer silhouette -->
  <path
    fill="#0a0908"
    d="M6 32c6-14 16-22 26-22s20 8 26 22c-6 14-16 22-26 22S12 46 6 32z"
  />

  <!-- upper lid -->
  <path
    fill="#1c1814"
    d="M8 31c5.5-12 14.5-19 24-19s18.5 7 24 19c-1.2-1.5-4-3.5-8.5-5.5C41 22 36 20.5 32 20.5S23 22 16.5 25.5C12 27.5 9.2 29.5 8 31z"
  />
  <!-- upper lid rim -->
  <path
    fill="none"
    stroke="#3a322c"
    stroke-width="1.4"
    stroke-linecap="round"
    d="M9 31c5-11 13.5-17.5 23-17.5S50 20 55 31"
  />

  <!-- lower lid -->
  <path
    fill="#161310"
    d="M8 33c5.5 11.5 14.5 18.5 24 18.5s18.5-7 24-18.5c-1.5 1.2-4.2 3-8.8 4.8C41 40.5 36.2 42 32 42s-9-1.5-15.2-4.2C12.2 36 9.5 34.2 8 33z"
  />
  <!-- lower lid rim -->
  <path
    fill="none"
    stroke="#2e2822"
    stroke-width="1.2"
    stroke-linecap="round"
    d="M9 33c5 11 13.5 17 23 17s18-6 23-17"
  />

  <!-- sclera / eye opening -->
  <ellipse cx="32" cy="32" rx="22" ry="11.5" fill="#f4efe8"/>
  <ellipse cx="32" cy="32" rx="22" ry="11.5" fill="none" stroke="#0a0908" stroke-width="1.5"/>

  <!-- iris -->
  <circle cx="32" cy="32" r="9.2" fill="url(#iris)"/>

  <!-- glowing pupil -->
  <g filter="url(#soft)">
    <circle cx="32" cy="32" r="7.2" fill="#ff6b35" opacity="0.35"/>
    <circle cx="32" cy="32" r="5.1" fill="url(#glow)"/>
    <circle cx="32" cy="31.2" r="1.6" fill="#fff6c8" opacity="0.9"/>
  </g>

  <!-- eyelid crease highlight -->
  <path
    fill="none"
    stroke="#4a4038"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.7"
    d="M14 24c5-4 11-6 18-6s13 2 18 6"
  />
</svg>
