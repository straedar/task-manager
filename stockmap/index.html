<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#141618" />
    <title>Stockmap — карта склада</title>
    <script>
      try {
        var t = localStorage.getItem("stockmap-ui-theme");
        if (t !== "classic" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-ui-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-ui-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
